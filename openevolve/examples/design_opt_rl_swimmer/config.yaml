# Configuration for robot structure design optimization
max_iterations: 100
checkpoint_interval: 5
log_level: "INFO"

# Evolution settings - use full rewrite mode for XML
diff_based_evolution: false  # Full rewrite mode for XML optimization
allow_full_rewrites: true
max_code_length: 50000  # Large enough for XML files
language: "xml"  # Set language to XML

# LLM configuration
llm:
  primary_model: "qwen-plus"
  primary_model_weight: 0.8
  secondary_model: "qwen-plus"
  secondary_model_weight: 0.2
  temperature: 0.7
  top_p: 0.95
  max_tokens: 8192
  timeout: 600

# Critic configuration

# Prompt configuration for XML robot design
prompt:
  system_message:
    "You are an expert in robotics, MuJoCo simulation, and robot morphology design. Your task is to optimize a robot design defined in MuJoCo XML format to maximize locomotion performance while adhering to best practices.

    Key Design Principles:
    1. **Structural Stability**: Ensure a robust base and secure joint connections for balance.
    2. **Locomotion Efficiency**: Design limbs and joints to maximize forward movement efficiency.
    3. **Actuator Coverage**: Assign motor actuators to all movable joints.
    4. **Physical Realism**: Use realistic sizes, masses, and joint ranges for simulation accuracy.
    5. **Complexity Balance**: Optimize capability without overly complex structures that hinder control.

    XML Structure Requirements:
    - Position the root body at an appropriate height for stability.
    - Ensure all hinge joints have corresponding motor actuators in the <actuator> section.
    - Match joint names exactly between <joint> and <motor> elements.
    - Define realistic joint ranges for natural movement.
    - Specify capsule geometries with accurate fromto coordinates.
    - Maintain valid MuJoCo XML syntax and structure.

    Optimization Strategies:
    Please modify one aspect of the robot design per iteration to isolate improvements: limbs, joints, or bodies.
    - Adjust limb lengths and orientations to enhance locomotion efficiency.
    - Strategically add or remove body segments to balance capability and simplicity.
    - Optimize body positions and orientations for improved stability and movement.
    - Ensure design complexity remains controllable.

    Output:
    - Do not include explanations, comments, or additional text outside the XML.
    - Return only the complete, valid MuJoCo XML."

  num_top_programs: 3
  num_diverse_programs: 5
  use_template_stochasticity: true
  suggest_simplification_after_chars: 30000
  
  critic:
    enabled: true
    aspects:
      - "limb lengths and orientations"
      - "body segments"
      - "body positions and orientations"
    model: "qwen-max"

# Database configuration
database:
  population_size: 30
  archive_size: 8
  num_islands: 5
  
  # Feature dimensions for MAP-Elites
  feature_dimensions: ["complexity_score", "actuator_efficiency"]
  feature_bins: 8
  
  elite_selection_ratio: 0.2
  exploration_ratio: 0.6
  exploitation_ratio: 0.3

# Evaluator configuration
evaluator:
  timeout: 1800  # 30 minutes for training
  cascade_evaluation: true
  cascade_thresholds: [0.2]  # Stage 1 must achieve 30% score to proceed
  parallel_evaluations: 1  # Single evaluation due to training overhead
  use_llm_feedback: true

elite_seeds:
  enabled: false
  files:
    - "./openevolve/examples/design_opt_rl_swimmer/init_xml/epoch_0100.xml"
    - "./openevolve/examples/design_opt_rl_swimmer/init_xml/epoch_0200.xml"
    - "./openevolve/examples/design_opt_rl_swimmer/init_xml/epoch_0300.xml"
    - "./openevolve/examples/design_opt_rl_swimmer/init_xml/epoch_0400.xml"
    - "./openevolve/examples/design_opt_rl_swimmer/init_xml/epoch_0500.xml"